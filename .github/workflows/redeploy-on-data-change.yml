# Admin panel JSON commit'leri bazen Vercel otomatik deploy tetiklemez.
# Deploy Hook secret tanımlıysa data/ değişince yeniden deploy başlatır.
name: Redeploy on data change

on:
  push:
    branches: [main]
    paths:
      - "htdocs/data/**"

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
