    <rect x="0" y="0" width="200" height="150" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
    <rect x="220" y="0" width="200" height="150" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
    <rect x="440" y="0" width="200" height="150" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
    <rect x="14" y="14" width="60" height="60" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="234" y="14" width="60" height="60" fill="#ffffff" fill-opacity="0.1"/>
    <rect x="454" y="14" width="60" height="60" fill="#ffffff" fill-opacity="0.1"/>
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="14" y="86" width="172" height="8"/><rect x="14" y="102" width="130" height="8"/><rect x="14" y="118" width="150" height="8"/>
      <rect x="234" y="86" width="172" height="8"/><rect x="234" y="102" width="130" height="8"/><rect x="234" y="118" width="150" height="8"/>
      <rect x="454" y="86" width="172" height="8"/><rect x="454" y="102" width="130" height="8"/><rect x="454" y="118" width="150" height="8"/>
