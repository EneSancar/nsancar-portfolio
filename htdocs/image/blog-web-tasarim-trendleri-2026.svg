    <path d="M52 -6l12 6-12 6z" fill="#ff4d00"/>
  </g>

  <!-- yeni: asimetrik, hiyerarşili -->
  <g transform="translate(856 356)">
    <text x="0" y="-14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2" fill="#00f0ff">2026 — HİYERARŞİ</text>
