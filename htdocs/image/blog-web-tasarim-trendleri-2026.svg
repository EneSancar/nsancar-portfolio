<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="2026 web tasarım trendleri kapak görseli: düzen karşılaştırma ızgarası">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#08090c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="48.5" y="48.5" width="1103" height="533" fill="none" stroke="#00f0ff" stroke-opacity="0.28"/>
  <g stroke="#00f0ff" stroke-opacity="0.75" stroke-width="1">
    <path d="M48.5 70.5V48.5H70.5"/>
    <path d="M1129.5 70.5V48.5H1107.5"/>
    <path d="M48.5 559.5V581.5H70.5"/>
    <path d="M1129.5 559.5V581.5H1107.5"/>
  </g>

  <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="4" fill="#8d97a8">WEB TASARIM · 2026 TRENDLERİ</text>
  <text x="1128" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="4" fill="#ff4d00">DÜZEN</text>
  <line x1="72" y1="118" x2="1128" y2="118" stroke="#ffffff" stroke-opacity="0.14"/>

