<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="SEO rehberi kapak görseli: arama sonucu sıralaması diyagramı">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#08090c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="48.5" y="48.5" width="1103" height="533" fill="none" stroke="#00f0ff" stroke-opacity="0.28"/>
  <g stroke="#00f0ff" stroke-opacity="0.75" stroke-width="1">
    <path d="M48.5 70.5V48.5H70.5"/>
    <path d="M1129.5 70.5V48.5H1107.5"/>
    <path d="M48.5 559.5V581.5H70.5"/>
    <path d="M1129.5 559.5V581.5H1107.5"/>
  </g>

  <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="4" fill="#8d97a8">SEO · KÜÇÜK İŞLETME REHBERİ</text>
  <text x="1128" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="4" fill="#ff4d00">ARAMA</text>
  <line x1="72" y1="118" x2="1128" y2="118" stroke="#ffffff" stroke-opacity="0.14"/>

  <text x="72" y="196" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="800" font-size="62" letter-spacing="-3" fill="#f1f4f7">Google'ın ilk sayfası</text>
  <text x="72" y="266" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="800" font-size="62" letter-spacing="-3" fill="#00f0ff">bir sıralama meselesi.</text>

  <text x="72" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="3" fill="#8d97a8">ARAMA SONUCU SAYFASI · TEMSİLİ DİZİLİM</text>

  <!-- sonuç satırları: 1. sıra öne çıkar, kalanı sönükleşir -->
  <g>
    <!-- 1. sıra -->
    <text x="72" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#ff4d00">01</text>
    <rect x="112" y="378" width="700" height="16" fill="#00f0ff"/>
    <rect x="112" y="400" width="420" height="7" fill="#00f0ff" fill-opacity="0.45"/>
    <line x1="836" y1="374" x2="836" y2="412" stroke="#ff4d00" stroke-width="1"/>
    <line x1="836" y1="393" x2="866" y2="393" stroke="#ff4d00" stroke-width="1"/>
    <text x="874" y="398" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="2" fill="#ff4d00">GÖRÜNÜR</text>

    <!-- 2. sıra -->
    <text x="72" y="452" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#55636b">02</text>
    <rect x="112" y="438" width="700" height="16" fill="#00f0ff" fill-opacity="0.30"/>
    <rect x="112" y="460" width="420" height="7" fill="#00f0ff" fill-opacity="0.14"/>

    <!-- 3. sıra -->
    <text x="72" y="512" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#55636b">03</text>
    <rect x="112" y="498" width="700" height="16" fill="#00f0ff" fill-opacity="0.18"/>
    <rect x="112" y="520" width="420" height="7" fill="#00f0ff" fill-opacity="0.08"/>

    <!-- 4. sıra: sayfa altı -->
    <text x="72" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#3a444d">04</text>
    <rect x="112" y="554" width="700" height="16" fill="#00f0ff" fill-opacity="0.09"/>
  </g>

  <!-- sağdaki açıklama -->
  <g transform="translate(950 380)">
    <line x1="0" y1="0" x2="0" y2="180" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="14" y="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#8d97a8">İLK SAYFA</text>
    <text x="14" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#00f0ff">1 — 3</text>
    <text x="14" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#8d97a8">SONRASI</text>
    <text x="14" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#55636b">4 +</text>
    <line x1="0" y1="84" x2="178" y2="84" stroke="#ffffff" stroke-opacity="0.14" stroke-dasharray="3 4"/>
  </g>
</svg>
