<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="PS5 kırılması ve Relapse açığı üzerine teknik inceleme kapak görseli">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#08090c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="48.5" y="48.5" width="1103" height="533" fill="none" stroke="#00f0ff" stroke-opacity="0.28"/>
  <g stroke="#00f0ff" stroke-opacity="0.75" stroke-width="1">
    <path d="M48.5 70.5V48.5H70.5"/>
    <path d="M1129.5 70.5V48.5H1107.5"/>
    <path d="M48.5 559.5V581.5H70.5"/>
    <path d="M1129.5 559.5V581.5H1107.5"/>
  </g>

  <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="4" fill="#8d97a8">PLAYSTATION 5 · KONSOL GÜVENLİĞİ</text>
  <text x="1128" y="96" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="4" fill="#ff4d00">İNCELEME</text>
  <line x1="72" y1="118" x2="1128" y2="118" stroke="#ffffff" stroke-opacity="0.14"/>

  <text x="72" y="212" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="800" font-size="66" letter-spacing="-3" fill="#f1f4f7">PS5 kırıldı,</text>
  <text x="72" y="286" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="800" font-size="66" letter-spacing="-3" fill="#00f0ff">peki bu gerçekte</text>
  <text x="72" y="360" font-family="Archivo, Helvetica, Arial, sans-serif" font-weight="800" font-size="66" letter-spacing="-3" fill="#f1f4f7">ne anlama geliyor?</text>

  <!-- Sürüm bandı: 7.00 -> 13.60 açık, 14.00 kapalı -->
  <g transform="translate(72 424)">
    <text x="0" y="-16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="3" fill="#8d97a8">ETKİLENEN YAZILIM SÜRÜMÜ</text>

    <!-- açık aralık -->
    <rect x="0" y="0" width="700" height="34" fill="#00f0ff" fill-opacity="0.18"/>
    <rect x="0" y="0" width="700" height="3" fill="#00f0ff"/>
    <text x="12" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#00f0ff">7.00 — 13.60</text>

    <!-- kapalı -->
    <rect x="706" y="0" width="350" height="34" fill="#ffffff" fill-opacity="0.05"/>
    <rect x="706" y="0" width="350" height="3" fill="#ff4d00"/>
    <text x="720" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2" fill="#8d97a8">14.00 · KAPALI</text>

    <!-- ayırıcı -->
    <line x1="703" y1="-8" x2="703" y2="42" stroke="#ff4d00" stroke-width="2"/>
    <path d="M703 -14l-7 7h14z" fill="#ff4d00"/>

    <text x="0" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#8d97a8">PS5 · PS5 SLIM · PS5 PRO</text>
    <text x="1056" y="66" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#ff4d00">KALICI DEĞİL</text>
  </g>

  <line x1="72" y1="582" x2="1128" y2="582" stroke="#ffffff" stroke-opacity="0.14"/>
  <text x="72" y="606" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="3" fill="#8d97a8">nsancar.com · TEKNİK İNCELEME</text>
</svg>
